# Install as groupdeal-health-probe.service.d/offhost.conf only after the first
# verified OneDrive upload. Missing/stale offhost receipts then raise alerts.
[Service]
ExecStart=
ExecStart=/home/ubuntu/groupdeal-runtime/node-v24.21.0-linux-x64/bin/node /home/ubuntu/groupdeal/operations/observe_hosted_health.cjs --backup-state-file /home/ubuntu/groupdeal/operations/backups/LATEST.json --offhost-state-file /home/ubuntu/groupdeal/operations/offhost/LATEST.json
