<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="title">GroupDeal · Thao tác trực tiếp trên Arc</title></head>
<body><main>
  <p class="eyebrow">GroupDeal · Arc Testnet</p><label for="fallback-language">Ngôn ngữ / Language</label><select id="fallback-language"><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
  <h1 data-i18n="heading">Thao tác trực tiếp trên Arc Testnet</h1><p data-i18n="intro"></p><p id="deployment" class="mono"></p><p data-i18n="circle"></p><p data-i18n="pending"></p>
  <button id="connect" type="button" data-i18n="connect">Kết nối ví external</button><p id="wallet" class="mono" data-i18n="disconnected">Chưa kết nối ví.</p>
  <form id="prepare">
    <label for="action" data-i18n="action">Thao tác</label><select id="action"><option value="DISPUTE" data-i18n="actionDISPUTE">Mở dispute</option><option value="BREACH" data-i18n="actionBREACH">Phân bổ hoàn tiền quá SLA</option><option value="BUYER_CLAIM" data-i18n="actionBUYER_CLAIM">Rút tiền buyer</option><option value="SELLER_CLAIM" data-i18n="actionSELLER_CLAIM">Rút doanh thu seller</option></select>
    <label for="campaign" data-i18n="campaign">ID campaign trên chain</label><input id="campaign" inputmode="numeric" pattern="[1-9][0-9]*" required>
    <label for="order" data-i18n="order">ID order trên chain</label><input id="order" inputmode="numeric" pattern="[1-9][0-9]*" required>
    <label for="reason" data-i18n="reason">Lý do dispute (chỉ hash được gửi lên chain)</label><textarea id="reason" maxlength="4000" autocomplete="off"></textarea><p data-i18n="privateReason"></p><button type="submit" data-i18n="prepare">Kiểm tra chain, quyền và gas</button>
  </form>
  <label for="existing-hash" data-i18n="existingHash">Hash đã gửi từ app/ví, chưa có checkpoint tại host này</label><input id="existing-hash" class="mono" autocomplete="off" placeholder="0x…"><button id="import" type="button" data-i18n="import">Tra giao dịch đã gửi</button>
  <section id="review" hidden aria-labelledby="review-title"><h2 id="review-title" data-i18n="review">Intent và phục hồi</h2><p id="summary" class="mono"></p>
    <section id="fee-review" aria-labelledby="fee-title"><h3 id="fee-title" data-i18n="feeTitle">Phí mạng trước chữ ký</h3><dl class="fee-list"><dt data-i18n="balance"></dt><dd id="fee-balance"></dd><dt data-i18n="network"></dt><dd id="fee-network"></dd><dt data-i18n="reserve"></dt><dd id="fee-reserve"></dd></dl><p data-i18n="feeHelp"></p><p id="fee-notice" aria-live="polite"></p><label class="fee-consent"><input id="fee-consent" type="checkbox"><span data-i18n="feeConsent"></span></label><button id="refresh-fee" type="button" data-i18n="refresh">Đọc lại phí và quyền</button></section>
    <button id="sign" type="button" data-i18n="sign">Ký intent đã kiểm tra</button>
    <label for="hash" data-i18n="hash">Hash đã gửi từ ví</label><input id="hash" class="mono" autocomplete="off" placeholder="0x…"><button id="recover" type="button" data-i18n="recover">Kiểm tra receipt</button><button id="discard" type="button" data-i18n="discard">Chuẩn bị thao tác khác</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p><p data-i18n="footer"></p>
</main><script type="module" src="/src/fallback/main.ts"></script></body></html>
