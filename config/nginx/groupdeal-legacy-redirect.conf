# Keep the former hostname only as a redirect for existing links.
server {
  listen 80;
  server_name groupdeal.thanhtan.top;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/groupdeal/acme; try_files $uri =404; }
  location / { return 308 https://groupdeal.tech$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name groupdeal.thanhtan.top;
  ssl_certificate /etc/letsencrypt/live/groupdeal.thanhtan.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/groupdeal.thanhtan.top/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=86400" always;
  return 308 https://groupdeal.tech$request_uri;
}
