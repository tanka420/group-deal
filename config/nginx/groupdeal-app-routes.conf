# Include inside the HTTPS server, after the existing /api/ and /health locations.
# Only app routes receive HTML. Missing assets and API responses keep their status.
location ~ "^/(?:explore|orders|wallet|account|notifications|seller|docs|support|admin)/?$|^/(?:deals|sellers|orders)/[A-Za-z0-9_-]{1,180}/?$|^/support/(?:orders|tickets)/[A-Za-z0-9_-]{1,180}/?$|^/admin/deals/[A-Za-z0-9_-]{1,180}(?:/(?:overview|orders|transactions|settlement|refunds|disputes|audit))?/?$" {
    try_files /index.html =404;
}
