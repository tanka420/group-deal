server {
  listen 80;
  server_name groupdeal.tech www.groupdeal.tech;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/groupdeal/acme; try_files $uri =404; }
  location / { return 301 https://groupdeal.tech$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name groupdeal.tech;
  ssl_certificate /etc/letsencrypt/live/groupdeal.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/groupdeal.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /var/www/groupdeal/releases/47d853f79ff5c2b1c8ac7f0f8163ca613fb82d9a;
  index index.html;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header Cache-Control "no-store" always;
  # This static notice stays enabled until the maintenance flag is removed.
  error_page 503 =503 /__maintenance/notice;
  location = /__maintenance/notice {
    internal;
    alias /var/www/groupdeal/maintenance/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Retry-After "3600" always;
  }
  location = /__maintenance/font-400.ttf { alias /var/www/groupdeal/releases/47d853f79ff5c2b1c8ac7f0f8163ca613fb82d9a/fonts/be-vietnam-pro/400.ttf; }
  location = /__maintenance/font-700.ttf { alias /var/www/groupdeal/releases/47d853f79ff5c2b1c8ac7f0f8163ca613fb82d9a/fonts/be-vietnam-pro/700.ttf; }
  location ~ (^|/)\. { return 404; }
  location ^~ /api/ {
    # Embed inside the HTTPS /api/ proxy location.
    # Keep one authoritative header set while preserving API privacy and HSTS.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control "private, no-store" always;
    proxy_pass http://127.0.0.1:18420;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }
  location = /health {
    proxy_pass http://127.0.0.1:18420;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }
# Include inside the HTTPS server, after the existing /api/ and /health locations.
# Only app routes receive HTML. Missing assets and API responses keep their status.
location ~ "^/(?:explore|orders|wallet|account|notifications|seller|docs|support|admin)/?$|^/policies/(?:how|terms|privacy|delivery|refunds|help|contact)/?$|^/(?:deals|sellers|orders)/[A-Za-z0-9_-]{1,180}/?$|^/support/(?:orders|tickets)/[A-Za-z0-9_-]{1,180}/?$|^/seller/(?:campaigns|orders|revenue|disputes|products|profile|integrations|create|transactions)/?$|^/admin/(?:access|deals|disputes|verifications|reconciliation|audit|outbox|operations|recovery|users|permissions|settings|support)/?$|^/admin/users/[A-Za-z0-9_-]{1,128}/?$|^/admin/support/(?:tickets|orders)/[A-Za-z0-9_-]{1,180}/?$|^/admin/deals/[A-Za-z0-9_-]{1,180}(?:/(?:overview|orders|transactions|settlement|refunds|disputes|audit))?/?$" {
    if (-f /var/www/groupdeal/maintenance/ENABLED) { return 503; }
    try_files /index.html =404;
}

  location = / {
    if (-f /var/www/groupdeal/maintenance/ENABLED) { return 503; }
    try_files /index.html =404;
  }
  location / {
    if (-f /var/www/groupdeal/maintenance/ENABLED) { return 503; }
    try_files $uri =404;
  }
}


server {
  listen 443 ssl http2;
  server_name www.groupdeal.tech;
  ssl_certificate /etc/letsencrypt/live/groupdeal.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/groupdeal.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=86400" always;
  return 308 https://groupdeal.tech$request_uri;
}
