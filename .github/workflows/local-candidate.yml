          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Chromium for isolated UI fixtures
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Tooling, type, build and scoped auth/profile/draft checks
        run: node scripts/run_r7_form_checks.cjs
      - name: Redacted R7 form results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
