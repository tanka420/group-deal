  tooling:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'tooling'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Locked package manager and tooling dependencies
        run: |
          npm install --global npm@11.6.2 --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --prefix backend --no-audit --no-fund
      - name: Isolation, redaction, occupied-port and every-action pin guards
        shell: bash
        run: |
          mkdir -p .cache
          set -o pipefail
          node test/local_pipeline.test.cjs | tee .cache/tooling-guard.log
      - name: Redacted tooling result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tooling-${{ github.sha }}
          path: .cache/tooling-guard.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  local:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Locked package manager
        run: |
          npm install --global npm@11.6.2 --no-audit --no-fund --registry=https://registry.npmjs.org
          node --version
          npm --version
      - name: Locked workspace dependencies
        run: |
          npm ci --prefix contracts --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix sdk --no-audit --no-fund
          npm ci --prefix integrations/cloudflare-receiver --no-audit --no-fund
      - name: Chromium for fixture journeys
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Tooling isolation and redaction guards
        run: node test/local_pipeline.test.cjs
      - name: Compile, models, APIs, SDK, builds and browser fixtures
        run: npm run verify:pipeline
      - name: Redacted local result records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-results-${{ github.sha }}
          path: |
            .cache/local-pipeline-*.json
            .cache/secret-scan-*.json
            .cache/fallback-http-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  current-arc-delta:
