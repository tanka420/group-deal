      - name: Route, type, build and affected browser checks
        run: node scripts/run_ui_foundation_checks.cjs
      - name: Scoped records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
