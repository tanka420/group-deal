      - name: Tooling, type, build and scoped seller profile checks
        run: node scripts/run_r7_profile_checks.cjs
      - name: Redacted R7 seller profile results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-profile-${{ github.sha }}
          path: |
