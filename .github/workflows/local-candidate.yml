name: Local candidate checks

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        required: true
        default: full
        options:
          - full
          - tooling
          - r7-forms
          - r7-profile
          - r7-share
          - r7-product
          - r567-matrix
          - r567-header
          - r7-resource
          - current-arc-delta
          - ui-foundation
          - ui-catalog
          - ui-orders
          - ui-seller
          - ui-admin
          - ui-wallet
          - ui-wallet-browser

permissions:
  contents: read

concurrency:
  group: local-candidate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

jobs:
  r567-matrix:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'r567-matrix' || inputs.scope == 'r567-header')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify R5–R7 matrix source scope
        run: node scripts/run_r567_matrix_checks.cjs --check-scope
      - name: Locked affected dependencies
        run: |
          npm install --global npm@11.6.2 --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Three engines for isolated UI fixtures
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Context, money and built UI matrix
        run: node scripts/run_r567_matrix_checks.cjs ${{ inputs.scope == 'r567-header' && '--header-only' || '' }}
      - name: Redacted R5–R7 matrix results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r567-matrix-${{ github.sha }}
          path: |
            .cache/r567-matrix-ci-*.json
            .cache/browser-run-*.json
            .cache/browser-artifacts-*/**/coverage.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  r7-resource:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'r7-resource'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify R7 upload and access code fields source scope
        run: node scripts/run_r7_resource_checks.cjs --check-scope
      - name: Locked affected dependencies
        run: |
          npm install --global npm@11.6.2 --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Chromium for isolated UI fixtures
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Tooling, type, build and scoped upload and access code checks
        run: node scripts/run_r7_resource_checks.cjs
      - name: Redacted R7 upload and access code fields results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-resource-${{ github.sha }}
          path: |
            .cache/r7-resource-ci-*.json
            .cache/browser-run-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  r7-product:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'r7-product'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify R7 product and rights fields source scope
        run: node scripts/run_r7_product_checks.cjs --check-scope
      - name: Locked affected dependencies
        run: |
          npm install --global npm@11.6.2 --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Chromium for isolated UI fixtures
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Tooling, type, build and scoped product and rights checks
        run: node scripts/run_r7_product_checks.cjs
      - name: Redacted R7 product and rights fields results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-product-${{ github.sha }}
          path: |
            .cache/r7-product-ci-*.json
            .cache/browser-run-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  r7-share:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'r7-share'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify R7 share and deal reflow source scope
        run: node scripts/run_r7_share_checks.cjs --check-scope
      - name: Locked affected dependencies
        run: |
          npm install --global npm@11.6.2 --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Chromium for isolated UI fixtures
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Tooling, type, build and scoped share and join checks
        run: node scripts/run_r7_share_checks.cjs
      - name: Redacted R7 share and deal reflow results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-share-${{ github.sha }}
          path: |
            .cache/r7-share-ci-*.json
            .cache/browser-run-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  r7-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'r7-profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
